name: AML Mod Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checking out repository...
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Installing Android NDK (r27)...
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27

    - name: Fix ARMPatch compatibility with NDK r27 / Gloss
      run: |
        echo "Applying compatibility fixes for NDK r27..."
        sed -i 's/\$ARM/I_ARM/g' ARMPatch/armpatch_src/ARMPatch.cpp
        sed -i 's/\$THUMB/I_THUMB/g' ARMPatch/armpatch_src/ARMPatch.cpp
        sed -i 's/Gloss::Inst::branchs::/Gloss::Inst::Branchs::/g' ARMPatch/armpatch_src/ARMPatch.cpp

    - name: Building ARMPatch...
      run: ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./ARMPatch/armpatch_src/Android.mk NDK_APPLICATION_MK=./ARMPatch/armpatch_src/Application.mk NDK_DEBUG=0 -j12
      
    - name: Building AML...
      run: ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk NDK_DEBUG=0 -j12

    - name: Finished. Uploading the results.
      uses: actions/upload-artifact@v4
      with:
        name: AML_Libraries
        path: ./libs/**/libAML.so
