name: AML Mod Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checking out repository...
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Installing Android NDK (r27)...
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27

    - name: Fix full compatibility with NDK r27 / Gloss / AML
      run: |
        echo "Applying full NDK r27 compatibility fixes..."
        
        # 1. تصحيح أخطاء Gloss المتغيرات والدوال في ARMPatch
        sed -i 's/\$ARM/I_ARM/g' ARMPatch/armpatch_src/ARMPatch.cpp
        sed -i 's/\$THUMB/I_THUMB/g' ARMPatch/armpatch_src/ARMPatch.cpp
        sed -i 's/Gloss::Inst::branchs::/Gloss::Inst::Branchs::/g' ARMPatch/armpatch_src/ARMPatch.cpp
        sed -i 's/GlossHookBranchB(/GlossHookBranchBL(/g' ARMPatch/armpatch_src/ARMPatch.cpp

        # 2. تصحيح أخطاء المتغيرات داخل ملفات AML (مثل src/aml.cpp)
        sed -i 's/i_set::\$THUMB/I_THUMB/g' src/aml.cpp
        sed -i 's/i_set::\$ARM/I_ARM/g' src/aml.cpp
        sed -i 's/\$THUMB/I_THUMB/g' src/aml.cpp
        sed -i 's/\$ARM/I_ARM/g' src/aml.cpp

        # 3. إصلاح استدعاء GlossHookInternal في src/aml.cpp لتتوافق مع 5 وسائط
        sed -i 's/GlossHookInternal((void\*)addr, (GlossHookInternalCallback)newFn, doShortHook,/GlossHookInternal((void\*)addr, (GlossHookInternalCallback)newFn, nullptr, doShortHook,/g' src/aml.cpp
        sed -i 's/GlossHookInternal(fnAddress, (GlossHookInternalCallback)newFn, doShortHook,/GlossHookInternal(fnAddress, (GlossHookInternalCallback)newFn, nullptr, doShortHook,/g' src/aml.cpp

        # 4. السماح بكرار الرمز (Duplicate Symbols) لتجنب توقف البناء بسبب تداخل xDL
        echo "LOCAL_LDFLAGS += -Wl,--allow-multiple-definition" >> ./Android.mk
        echo "LOCAL_LDFLAGS += -Wl,--allow-multiple-definition" >> ./ARMPatch/armpatch_src/Android.mk

        # 5. إزالة خيار -mfloat-abi المسبب للمشكلة لمعمارية arm64 من جميع ملفات .mk
        find . -type f \( -name "*.mk" \) -exec sed -i '/-mfloat-abi=/d' {} +

    - name: Building ARMPatch...
      run: ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./ARMPatch/armpatch_src/Android.mk NDK_APPLICATION_MK=./ARMPatch/armpatch_src/Application.mk NDK_DEBUG=0 -j12
      
    - name: Building AML...
      run: ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk NDK_DEBUG=0 -j12

    - name: Finished. Uploading the results.
      uses: actions/upload-artifact@v4
      with:
        name: AML_Libraries
        path: ./libs/**/libAML.so
